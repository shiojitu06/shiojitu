    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root{
      --yellow-main:#04d94e;
      --yellow-dark:#0ea04b;
      --yellow-darker:#1a1500;

      --gold:#5ed694;
      --gold-light:#7af2bc;

      --bg-main:#090006;

      --gradient-main:

          135deg,
          #1a1600,
          #0ea04b,
          #04d94e,
          #5ed694,
          #1a1500
        );

      --shadow-yellow:
        0 0 25px rgba(11, 226, 144, 0.45);

      --shadow-gold:
        0 0 25px rgba(94, 214, 170,0.45);
    }

    body{
      font-family:'Courier New', monospace;

      background:var(--bg-main);

      background-image:
        radial-gradient(
          rgba(11, 226, 144,0.16) 1px,
          transparent 1px
        ),
        radial-gradient(
          rgba(94, 214, 170,0.08) 1px,
          transparent 1px
        );

      background-size:
        40px 40px,
        80px 80px;

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .container{
      position:relative;

      max-width:420px;
      width:90%;

      margin:20px auto;
      padding:25px 20px;

      display:flex;
      flex-direction:column;
      gap:15px;

      background:rgba(26,0,6,0.92);

      border:2px solid rgba(11, 226, 144,0.35);
      border-radius:30px;

      box-shadow:
        0 0 30px rgba(11, 226, 144,0.35),
        inset 0 0 25px rgba(11, 226, 144,0.16);

      overflow:hidden;
    }

    .container::before{
      content:'';

      position:absolute;
      inset:-2px;

      border-radius:30px;

      background:
        conic-gradient(
          from 0deg,
          transparent,
          #087c3a,
          #04d94e,
          #3bffc7,
          transparent
        );

      z-index:-2;

      animation:rotateBorder 6s linear infinite;
    }

    .container::after{
      content:'';

      position:absolute;
      inset:0;

      border-radius:30px;
      padding:2px;

      background:
        linear-gradient(
          120deg,
          #087c3a,
          #04d94e,
          #3bffa3,
          #087c3a
        );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      -webkit-mask-composite:xor;
      mask-composite:exclude;

      animation:borderMove 4s linear infinite;

      pointer-events:none;
    }

    @keyframes borderMove{
      0%{
        filter:hue-rotate(0deg);
      }
      100%{
        filter:hue-rotate(360deg);
      }
    }

    @keyframes rotateBorder{
      100%{
        transform:rotate(360deg);
      }
    }

    .button-grid{

    .copyright{

    .animated{

      animation-iteration-count:infinite;
    }

    .tada{
      animation-name:tada;
    }

    .slower{
      animation-duration:3s;
    }

    @keyframes tada{
      0%{
        transform:scale3d(1,1,1);
      }

      10%,
      20%{
        transform:
          scale3d(0.9,0.9,0.9)
          rotate3d(0,0,1,-3deg);
      }

      30%,
      50%,
      70%,
      90%{
        transform:
          scale3d(1.1,1.1,1.1)
          rotate3d(0,0,1,3deg);
      }

      40%,
      60%,
      80%{
        transform:
          scale3d(1.1,1.1,1.1)
          rotate3d(0,0,1,-3deg);
      }

      100%{
        transform:scale3d(1,1,1);
      }
    }

    .gold-sparkle{
      position:fixed;

      pointer-events:none;

      width:100%;
      height:100%;

      top:0;
      left:0;

      z-index:9999;
    }

    .gold-sparkle span{
      position:absolute;

      width:6px;
      height:6px;

      background:#5ed694;

      border-radius:50%;

      box-shadow:
        0 0 20px #7af2bc;

      animation:sparkle 3s ease-in-out infinite;

      opacity:0;
    }

    @keyframes sparkle{
      0%{
        transform:scale(0);
        opacity:0;
      }

      50%{
        transform:scale(1);
        opacity:0.8;
      }

      100%{
        transform:scale(0);
        opacity:0;
      }
    }

    .gold-sparkle span:nth-child(1){
      top:10%;
      left:20%;
      animation-delay:0s;
    }

    .gold-sparkle span:nth-child(2){
      top:30%;
      left:80%;
      animation-delay:1s;
    }

    .gold-sparkle span:nth-child(3){

      left:40%;
      animation-delay:2s;
    }

    .gold-sparkle span:nth-child(4){

      left:70%;
      animation-delay:1.5s;
    }

    .gold-sparkle span:nth-child(5){
      top:45%;
      left:15%;
      animation-delay:2.5s;
    }
