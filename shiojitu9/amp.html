  @keyframes pulseBg {

  .container {

    display: flex; 
    flex-direction: column; 
    gap: 15px;

    box-shadow: 
      0 0 0 1px rgba(255, 204, 0, 0.12),
      0 20px 40px rgba(0, 0, 0, 0.85),

    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.8s ease;
  }
  
  /* Border glow gold */
  .container::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: conic-gradient(
      from 0deg,
      transparent,
      #ffcc00,
      #fff5b8,
      #ffcc00,
      transparent
    );
    border-radius: 32px;
    z-index: -2;
    animation: rotateBorder 6s linear infinite;
  }
  
  .container::after {
    content: '';
    position: absolute;
    inset: 2px;
    background: rgba(0, 0, 0, 0.94);
    border-radius: 28px;
    z-index: -1;
  }
  
  @keyframes rotateBorder {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
