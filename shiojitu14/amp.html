.card {

}

.card::before {
	content: "";
	position: absolute;
	top: -50%;
	left: -50%;
	width: 200%;
	height: 200%;
	background: radial-gradient(circle, rgb(255, 0, 0), transparent 70%);
	animation: neonWave 6s linear infinite;
	filter: blur(25px);
	z-index: 0

@keyframes neonWave {

.btn:hover {

	transform: translateY(-2px)
}

@keyframes rotateBorder {

@keyframes glowPulse {
